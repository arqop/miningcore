name: Develop image

on:
  push:
    branches: [ develop ]

concurrency:
  group: develop-image-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish develop image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      candidate-registry:
        image: registry@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
        ports:
          - 127.0.0.1:5000:5000
        options: >-
          --read-only --cap-drop=ALL --security-opt=no-new-privileges --user=1000:1000
          --tmpfs=/var/lib/registry:rw,nosuid,nodev,size=4294967296,mode=1777
    steps:
      - name: Checkout develop commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."127.0.0.1:5000"]
              http = true

      - name: Install verified publication tool
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends skopeo

      - name: Build develop candidate
        id: candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: MININGCORE_CONTAINER_APT_TIMEOUT_SECONDS=420
          push: true
          tags: 127.0.0.1:5000/miningcore:develop
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=develop-image
          cache-to: type=gha,mode=max,scope=develop-image

      - name: Smoke-test develop candidate
        env:
          IMAGE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: docker run --rm "127.0.0.1:5000/miningcore@$IMAGE_DIGEST" --version

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish verified develop image
        timeout-minutes: 20
        env:
          IMAGE_DIGEST: ${{ steps.candidate.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          source="127.0.0.1:5000/miningcore@$IMAGE_DIGEST"
          python3 -B scripts/release/publish-verified-image.py \
            --source "$source" --destination "$image:develop-$GITHUB_SHA"

          branch=$(git ls-remote --exit-code origin refs/heads/develop)
          if [[ "${branch%%$'\t'*}" == "$GITHUB_SHA" ]]; then
            docker buildx imagetools create --prefer-index=false \
              --tag "$image:develop" "$image@$IMAGE_DIGEST"
          fi
